<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-primary mb-0">Tablero Principal</h4>
            <small class="text-muted">Resumen de operaciones en tiempo real</small>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="module_dashboard.init()">
            <span class="material-icons align-middle fs-6">refresh</span> Actualizar
        </button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 border-start border-4 border-primary">
                <div class="card-body">
                    <div class="text-muted small text-uppercase fw-bold">Inventario Total</div>
                    <h2 class="mb-0 mt-2 fw-bold" id="kpiTotal">0</h2>
                    <small class="text-muted">Lotes/Unidades</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 border-start border-4 border-success">
                <div class="card-body">
                    <div class="text-muted small text-uppercase fw-bold">Disponibles</div>
                    <h2 class="mb-0 mt-2 fw-bold text-success" id="kpiDisponibles">0</h2>
                    <small class="text-muted">Listos para venta</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 border-start border-4 border-danger">
                <div class="card-body">
                    <div class="text-muted small text-uppercase fw-bold">Vendidos</div>
                    <h2 class="mb-0 mt-2 fw-bold text-danger" id="kpiVendidos">0</h2>
                    <small class="text-muted">Unidades cerradas</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100 border-start border-4 border-warning">
                <div class="card-body">
                    <div class="text-muted small text-uppercase fw-bold">Cartera Pendiente</div>
                    <h4 class="mb-0 mt-2 fw-bold text-uppercase" id="kpiPendiente">$0</h4>
                    <small class="text-muted">Por recaudar</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header  py-3">
                    <h6 class="mb-0 fw-bold">Tendencia de Ventas (Últimos 6 meses)</h6>
                </div>
                <div class="card-body">
                    <canvas id="chartVentas"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header  py-3">
                    <h6 class="mb-0 fw-bold">Estado de Cartera</h6>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <div style="width: 100%; max-width: 300px;">
                        <canvas id="chartFinanzas"></canvas>
                    </div>
                </div>
                <div class="card-footer  border-0 text-center pb-3">
                    <small class="text-muted">Total gestionado en cuotas</small>
                </div>
            </div>
        </div>
    </div>
</div>
