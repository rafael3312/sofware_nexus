<div class="container-fluid p-0">
    <h5 class="fw-bold text-primary mb-4">Gestión de Recaudos y Cartera</h5>

    <!-- BUSCADOR PRINCIPAL -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <div class="input-group input-group-lg">
                <span class="input-group-text bg-white border-end-0">
                    <span class="material-icons text-muted">search</span>
                </span>
                <input type="text" id="inputBuscarCartera" class="form-control border-start-0" 
                       placeholder="Buscar por Cédula del Cliente o Código de Lote..."
                       onkeypress="if(event.key === 'Enter') module_pagos.buscar()">
                <button class="btn btn-primary px-4 fw-bold" onclick="module_pagos.buscar()">Consultar</button>
            </div>
        </div>
    </div>

    <!-- MENSAJE DE BIENVENIDA / VACÍO -->
    <div id="mensajeVacio" class="text-center py-5 text-muted">
        <span class="material-icons fs-1 opacity-25" style="font-size: 4rem;">account_balance_wallet</span>
        <p class="mt-3 fs-5">Ingresa un dato arriba para ver el estado de cuenta.</p>
    </div>

    <!-- RESULTADOS (Oculto al inicio) -->
    <div id="panelResultados" class="d-none">
        
        <!-- RESUMEN DEL CLIENTE -->
        <div class="alert alert-light border shadow-sm d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3 text-primary">
                    <span class="material-icons fs-3">person</span>
                </div>
                <div>
                    <h5 class="fw-bold mb-0" id="resumenCliente">Nombre Cliente</h5>
                    <small class="text-muted fs-6" id="resumenLote">Lote: --</small>
                </div>
            </div>
            <div class="text-end">
                <small class="text-muted d-block">Deuda Vencida / Pendiente</small>
                <h3 class="fw-bold mb-0" id="resumenDeuda">$0</h3>
            </div>
        </div>

        <!-- PESTAÑAS POR LOTE -->
        <ul class="nav nav-tabs mb-3" id="tabsLotes" role="tablist">
        </ul>

        <!-- CONTENIDO LOTES -->
        <div class="tab-content" id="contenidoLotes">
        </div>
