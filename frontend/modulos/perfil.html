<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg">
                
                <div class="card-header bg-primary text-white text-center py-4 position-relative">
                    <div class="position-relative d-inline-block">
                        <img id="imgPerfilPreview" src="https://ui-avatars.com/api/?name=User" 
                             class="rounded-circle border border-4 border-white shadow" 
                             style="width: 120px; height: 120px; object-fit: cover; background: #fff;">
                        
                        <label for="inputFotoPerfil" class="btn btn-sm btn-light rounded-circle position-absolute bottom-0 end-0 mb-1 me-1 shadow-sm" 
                               style="width: 35px; height: 35px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                            <span class="material-icons text-primary fs-6">camera_alt</span>
                        </label>
                    </div>
                    <h4 class="mt-3 mb-0 fw-bold" id="lblUsername">Cargando...</h4>
                    <small id="lblRol" class="opacity-75">...</small>
                </div>

                <div class="card-body p-4">
                    <form id="formPerfil">
                        
                        <input type="file" id="inputFotoPerfil" name="foto" class="d-none" accept="image/*" onchange="module_perfil.previsualizarFoto(this)">

                        <div id="bloqueEmpleado" class="d-none">
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted">Primer Nombre</label>
                                    <input type="text" class="form-control" name="primer_nombre">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted">Segundo Nombre</label>
                                    <input type="text" class="form-control" name="segundo_nombre">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label small text-muted">Primer Apellido</label>
                                    <input type="text" class="form-control" name="primer_apellido">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted">Segundo Apellido</label>
                                    <input type="text" class="form-control" name="segundo_apellido">
                                </div>
                            </div>
                        </div>

                        <div id="bloqueOwner" class="d-none mb-3">
                            <label class="form-label small text-muted">Razón Social / Nombre Empresa</label>
                            <input type="text" class="form-control" name="razon_social">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Correo Electrónico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Documento (No editable)</label>
                            <input type="text" class="form-control bg-light" id="inputDocumento" readonly>
                        </div>

                        <hr class="my-4">

                        <h6 class="text-primary fw-bold mb-3">Seguridad</h6>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Nueva Contraseña</label>
                            <input type="password" class="form-control" name="password" placeholder="Dejar en blanco para mantener la actual">
                        </div>

                        <div class="d-grid mt-4">
                            <button type="button" class="btn btn-primary btn-lg" onclick="module_perfil.guardarPerfil()">
                                Guardar Cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
