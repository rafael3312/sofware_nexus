<div class="container-fluid p-0">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h5 class="fw-bold text-primary mb-1">Portafolio de Proyectos</h5>
            <p class="text-muted small mb-0">Administra tus urbanizaciones y etapas.</p>
        </div>

        <div class="d-flex align-items-center gap-2">
            <!-- FILTRO ESTADO -->
            <div class="input-group input-group-sm">
                <label class="input-group-text bg-white" for="filtroEstadoProy">Ver:</label>
                <select class="form-select bg-light fw-bold text-dark" id="filtroEstadoProy" onchange="module_proyectos.cambiarFiltroEstado()">
                    <option value="1">🟢 Activos</option>
                    <option value="0">🔴 Archivados</option>
                </select>
            </div>

            <button class="btn btn-primary btn-sm px-3" onclick="module_proyectos.abrirModalCrear()">
                <span class="material-icons align-middle fs-6 me-1">add_location_alt</span> Nuevo
            </button>
        </div>
    </div>

    <!-- Contenedor Grid -->
    <div class="row g-4" id="gridProyectos"></div>
</div>

<!-- Modal Gestión Proyecto (Igual que antes) -->
<div class="modal fade" id="modalProyecto" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="modalProyectoTitle">Gestión Proyecto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formProyecto">
                    <input type="hidden" id="proyId" name="id">
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre del Proyecto *</label>
                        <input type="text" class="form-control" id="proyNombre" name="nombre" required placeholder="Ej: Altos del Bosque">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ubicación *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="material-icons fs-6">place</i></span>
                            <input type="text" class="form-control" id="proyUbicacion" name="ubicacion" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado Actual</label>
                        <select class="form-select" id="proyStatus" name="status">
                            <option value="planificacion">En Planificación</option>
                            <option value="venta">En Ventas</option>
                            <option value="vendido">Finalizado / Vendido</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="proyDescripcion" name="description" rows="3"></textarea>
                    </div>

                    <!-- Sección Plano -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">Plano Interactivo (SVG)</label>
                        <input type="file" class="form-control" name="plano" accept=".svg">
                        <div class="form-text small">
                            <i class="fas fa-info-circle"></i> Los IDs del SVG deben coincidir con los códigos de lote.
                        </div>
                    </div>

                    <!-- Galería de Fotos Existentes -->
                    <div id="bloqueGaleriaProy" class="mb-3 d-none">
                        <label class="form-label fw-bold">Fotos Actuales</label>
                        <div id="galeriaProy" class="d-flex flex-wrap gap-2 p-2 bg-light rounded border"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subir Imágenes (Máx 5)</label>
                        <input type="file" class="form-control" name="imagenes" multiple accept="image/*">
                    </div>

                    <!-- Generación Automática -->
                    <div id="bloqueAutoLotes" class="alert alert-light border mt-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="checkAutoLotes" onchange="module_proyectos.toggleAutoLotes()">
                            <label class="form-check-label fw-bold" for="checkAutoLotes">Generar Lotes Automáticamente</label>
                        </div>
                        <div id="camposAutoLotes" class="mt-3 d-none">
                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label small">Cantidad</label>
                                    <input type="number" class="form-control form-control-sm" name="auto_units" placeholder="20">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small">Precio Base</label>
                                    <input type="number" class="form-control form-control-sm" name="base_price">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small">Área (m²)</label>
                                    <input type="number" class="form-control form-control-sm" name="base_area">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="module_proyectos.guardarProyecto()">Guardar Datos</button>
            </div>
        </div>
    </div>
</div>
