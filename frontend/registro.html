<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Inmobiliaria - Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card" style="max-width: 500px;"> <div class="card-header">
                <div class="logo">Nexus IT</div>
                <h4 class="mb-0 fw-light">Registrar Inmobiliaria</h4>
            </div>
            
            <div class="card-body">
                <form id="registroForm">
                    
                    <h6 class="text-muted small fw-bold mb-3">Datos de la Empresa</h6>
                    
                    <div class="mb-3">
                        <label class="form-label">Razón Social / Nombre Empresa *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-building"></i></span>
                            <input type="text" class="form-control" id="razon_social" placeholder="Ej: Inmobiliaria El Roble S.A.S" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">NIT o Cédula Propietario *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                            <input type="text" class="form-control" id="numero_documento" placeholder="Ej: 900123456" required>
                        </div>
                    </div>

                    <hr>

                    <h6 class="text-muted small fw-bold mb-3">Datos de Acceso (Administrador)</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Usuario *</label>
                            <input type="text" class="form-control" id="username" placeholder="admin_roble" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" placeholder="gerencia@elroble.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirmar Contraseña *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-check"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <div id="passwordError" class="form-text text-danger d-none">Las contraseñas no coinciden</div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 mb-3">
                        Registrar Empresa <i class="fas fa-check-circle ms-2"></i>
                    </button>

                    <div class="text-center mt-3">
                        <span class="small text-muted">¿Ya tienes cuenta?</span>
                        <a href="login.html" class="small fw-bold text-decoration-none">Iniciar Sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
